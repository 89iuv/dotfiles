# Status
set -g status-interval 1
set -g escape-time 40
set -g repeat-time 350
set -g display-time 1500

# Terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:RGB'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-features ',*:sync'

# Settings
set -g history-limit 9000
set -g set-clipboard on
set -g wrap-search off
set -g mouse on
set -g allow-passthrough all
set -g visual-activity off
set -g focus-events on
set -g detach-on-destroy off
set -g mode-keys vi

# Visual
set -s theme terminal
set -g set-titles on
set -g set-titles-string "#S: #{window_name} at #H "
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Default status bar for all windows
default_window_terminal="#[fg=#{@thm_surface_1}]󰆍 "
default_window_number="#[fg=#{@thm_surface_1}]#(~/.dotfiles/tmux/scripts/custom_number.sh '#I' 'dsquare')"
default_window_name="#[fg=#{@thm_surface_1}]#{?#{==:#{window_name},window},#{pane_current_command},#W}"
default_window_panes="#[fg=#{@thm_surface_1}]#(~/.dotfiles/tmux/scripts/custom_number.sh '#{window_panes}' 'hsquare')"
default_window_flags="\
#{?#{window_last_flag},,󰖰 }\
#{?#{window_last_flag},󰖲 ,}\
#{?#{window_zoomed_flag},󰁌 ,}\
#[fg=#{@thm_yellow}]#{?#{window_marked_flag},󰙒 ,}\
"

# Custom status bar for current window
current_window_terminal="#[fg=#{@thm_maroon}]󰆍 "
current_window_number="#[fg=#{@thm_peach}]#(~/.dotfiles/tmux/scripts/custom_number.sh '#I' 'msquare')"
current_window_name="#[fg=#{@thm_fg}]#{?#{==:#{window_name},window},#{pane_current_command},#W}"
current_window_panes="#[fg=#{@thm_overlay_2}]#(~/.dotfiles/tmux/scripts/custom_number.sh '#{window_panes}' 'hsquare')"
current_window_flags="#[fg=#{@thm_yellow}]\
#{?#{window_active},󰖯 ,}\
#{?#{window_zoomed_flag},󰁌 ,}\
#{?#{window_marked_flag},󰙒 ,}\
"

# Custom status bar for current pane
default_pane_flags="#[fg=#{@thm_yellow}]\
#{?#{pane_active},󰓎 ,}\
#{?#{pane_marked},󰙒 ,}\
"

# Change prefix key
unbind c-b
set-option -g prefix M-u
bind M-u send-prefix

# Sessions
bind -n M-s choose-tree -Z -s
bind -n M-\( switch-client -p
bind -n M-\) switch-client -n

# Windows
bind -n M-w choose-tree -Z -w

bind -n M-\, previous-window
bind -n M-\. next-window

bind -n C-M-left previous-window
bind -n C-M-right next-window

bind -n M-\< swap-window -t -1\; select-window -t -1
bind -n M-\> swap-window -t +1\; select-window -t +1

bind -n C-M-S-left swap-window -t -1\; select-window -t -1
bind -n C-M-S-right swap-window -t +1\; select-window -t +1

bind 1 select-layout even-horizontal
bind 2 select-layout even-vertical
bind 3 select-layout main-horizontal
bind 4 select-layout main-horizontal-mirrored
bind 5 select-layout main-vertical
bind 6 select-layout main-vertical-mirrored
bind 7 select-layout tiled

# Panes
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind V choose-tree -Z -F "#{E:@choose_tree_format}" 'join-pane -h -s "%%"'
bind S choose-tree -Z -F "#{E:@choose_tree_format}" 'join-pane -v -s "%%"'

bind b if-shell " [ #{window_panes} -gt '1' ] " { break-pane -a }

bind -n M-left select-pane -L
bind -n M-down select-pane -D
bind -n M-up select-pane -U
bind -n M-right select-pane -R

bind -n M-S-down swap-pane -D
bind -n M-S-up swap-pane -U

# copy mode vim keybindings
bind "[" copy-mode \; send "0"

bind -T copy-mode-vi v send -X rectangle-off \; send -X begin-selection
bind -T copy-mode-vi C-q send -X rectangle-on \; send -X begin-selection

bind -T copy-mode-vi y send -X copy-selection
bind-key -T copy-mode-vi p paste-buffer \; send-keys -X cancel

# scroll pane
bind C-u copy-mode -u \; send "0"
bind C-d copy-mode -d \; send "0"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Configure Catppuccin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none" # none == default
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Bootstrap
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Configure Tmux
set -g status-position bottom
set -g status-style "bg=#{@thm_mantle}"
set -g status-justify "left"

# Style
set -g @custom_status_separator "#[fg=#{@thm_surface_2},bg=default,none]"
set -g @custom_status_inline "󱋱"
set -g @custom_text "#[fg=#{@thm_subtext_0}]"

# status left look and feel
set -g status-left-length 80
set -g status-left ""

# status left modules
set -ga status-left "#[fg=#{@thm_green}]#{?client_prefix,#[fg=#{@thm_red}],} 󱗜 #S 󰅂  #[none]"

# status right look and feel
set -g status-right-length 160
set -g status-right ""

# status right modules
set -ga status-right "#{E:#{@custom_status_separator}}"
set -ga status-right "#[fg=#{@thm_blue}]#{E:#{@custom_status_inline}} 󰉋 #{E:#{@custom_text}}#{b:pane_current_path} "

set -ga status-right "#{E:#{@custom_status_separator}}"
set -ga status-right "#[fg=#{@thm_mauve}]#{E:#{@custom_status_inline}} #{?#([ -f "/.dockerenv" ] && echo true),󰒋 ,󰍹 }#{E:#{@custom_text}}#h "
set -ga status-right "#[fg=#{@thm_lavender}]#{E:#{@custom_status_inline}} 󱨰 #{E:#{@custom_text}}%Y-%m-%d "
set -ga status-right "#[fg=#{@thm_lavender}]#{E:#{@custom_status_inline}} 󰅐 #{E:#{@custom_text}}%H:%M "

# pane border look and feel
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-active-border-style "fg=#{@thm_peach},bg=default"
setw -g pane-border-style "fg=#{@thm_overlay_2},bg=default"
setw -g pane-border-lines single

# popup
setw -g popup-border-style "fg=#{@thm_peach},bg=default"

# choose tree
setw -g mode-style "fg=#{@thm_bg},bg=#{@thm_peach}"
setw -g tree-mode-border-style "fg=#{@thm_text},bg=#{@thm_bg}"

# command line look and feel
set -g message-style "bg=#{@thm_surface_0}, fg=#{@thm_fg}, fill=#{@thm_surface_0}"
set -g message-command-style "bg=#{@thm_mantle}, fg=#{@thm_fg}, fill=#{@thm_mantle}"

# window status format
set -gF window-status-separator "#[fg=#{@thm_surface_1}] "
set -g window-status-format " $default_window_terminal$default_window_number$default_window_name $default_window_panes$default_window_flags "
set -g window-status-style "bg=default"

# window status current format
set -g window-status-current-format " $current_window_terminal$current_window_number$current_window_name $current_window_panes$current_window_flags "
set -g window-status-current-style "bg=#{@thm_bg}"

# show startup screen
# Hook to run fastfetch on window creation if there's only one window
set-hook -g after-new-session 'send " clear && fastfetch" C-m'
