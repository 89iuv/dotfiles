# Status
set -g status-interval 1
set -g escape-time 20
set -g repeat-time 350
set -g display-time 1500

# Terminal features and overrides
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB:sync'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Settings
set -g history-limit 50000
set -g set-clipboard on
set -g allow-passthrough on
set -g monitor-activity off
set -g visual-activity off
set -g focus-events on
set -g detach-on-destroy off
set -g mode-keys vi
set -g wrap-search off
set -g mouse on

# Visual
set -g set-titles on
set -g set-titles-string "#S: #{window_name} at #H"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --> Catppuccin (Macchiato)
set -ogq @thm_bg "#24273a"
set -ogq @thm_fg "#cad3f5"

# Colors
set -ogq @thm_rosewater "#f4dbd6"
set -ogq @thm_flamingo "#f0c6c6"
set -ogq @thm_pink "#f5bde6"
set -ogq @thm_mauve "#c6a0f6"
set -ogq @thm_red "#ed8796"
set -ogq @thm_maroon "#ee99a0"
set -ogq @thm_peach "#f5a97f"
set -ogq @thm_yellow "#eed49f"
set -ogq @thm_green "#a6da95"
set -ogq @thm_teal "#8bd5ca"
set -ogq @thm_sky "#91d7e3"
set -ogq @thm_sapphire "#7dc4e4"
set -ogq @thm_blue "#8aadf4"
set -ogq @thm_lavender "#b7bdf8"

# Surfaces and overlays
set -ogq @thm_subtext_1 "#a5adcb"
set -ogq @thm_subtext_0 "#b8c0e0"
set -ogq @thm_overlay_2 "#939ab7"
set -ogq @thm_overlay_1 "#8087a2"
set -ogq @thm_overlay_0 "#6e738d"
set -ogq @thm_surface_2 "#5b6078"
set -ogq @thm_surface_1 "#494d64"
set -ogq @thm_surface_0 "#363a4f"
set -ogq @thm_mantle "#1e2030"
set -ogq @thm_crust "#181926"

# Number formats
set -g @num_dsquare_idx "#{s/0/󰎢 /:#{s/1/󰎥 /:#{s/2/󰎨 /:#{s/3/󰎫 /:#{s/4/󰎲 /:#{s/5/󰎯 /:#{s/6/󰎴 /:#{s/7/󰎷 /:#{s/8/󰎺 /:#{s/9/󰎽 /:#{window_index}}}}}}}}}}}"
set -g @num_dsquare_panes "#{s/0/󰎢 /:#{s/1/󰎥 /:#{s/2/󰎨 /:#{s/3/󰎫 /:#{s/4/󰎲 /:#{s/5/󰎯 /:#{s/6/󰎴 /:#{s/7/󰎷 /:#{s/8/󰎺 /:#{s/9/󰎽 /:#{window_panes}}}}}}}}}}}"
set -g @num_fsquare_idx "#{s/0/󰎡 /:#{s/1/󰎤 /:#{s/2/󰎧 /:#{s/3/󰎪 /:#{s/4/󰎭 /:#{s/5/󰎱 /:#{s/6/󰎳 /:#{s/7/󰎶 /:#{s/8/󰎹 /:#{s/9/󰎼 /:#{window_index}}}}}}}}}}}"
set -g @num_fsquare_panes "#{s/0/󰎡 /:#{s/1/󰎤 /:#{s/2/󰎧 /:#{s/3/󰎪 /:#{s/4/󰎭 /:#{s/5/󰎱 /:#{s/6/󰎳 /:#{s/7/󰎶 /:#{s/8/󰎹 /:#{s/9/󰎼 /:#{window_panes}}}}}}}}}}}"
set -g @num_hsquare_idx "#{s/0/󰎣 /:#{s/1/󰎦 /:#{s/2/󰎩 /:#{s/3/󰎬 /:#{s/4/󰎮 /:#{s/5/󰎰 /:#{s/6/󰎵 /:#{s/7/󰎸 /:#{s/8/󰎻 /:#{s/9/󰎾 /:#{window_index}}}}}}}}}}}"
set -g @num_hsquare_panes "#{s/0/󰎣 /:#{s/1/󰎦 /:#{s/2/󰎩 /:#{s/3/󰎬 /:#{s/4/󰎮 /:#{s/5/󰎰 /:#{s/6/󰎵 /:#{s/7/󰎸 /:#{s/8/󰎻 /:#{s/9/󰎾 /:#{window_panes}}}}}}}}}}}"
set -g @num_msquare_idx "#{s/0/󰼎 /:#{s/1/󰼏 /:#{s/2/󰼐 /:#{s/3/󰼑 /:#{s/4/󰼒 /:#{s/5/󰼓 /:#{s/6/󰼔 /:#{s/7/󰼕 /:#{s/8/󰼖 /:#{s/9/󰼗 /:#{window_index}}}}}}}}}}}"
set -g @num_msquare_panes "#{s/0/󰼎 /:#{s/1/󰼏 /:#{s/2/󰼐 /:#{s/3/󰼑 /:#{s/4/󰼒 /:#{s/5/󰼓 /:#{s/6/󰼔 /:#{s/7/󰼕 /:#{s/8/󰼖 /:#{s/9/󰼗 /:#{window_panes}}}}}}}}}}}"
set -g @num_none_idx "#{s/0/0 /:#{s/1/1 /:#{s/2/2 /:#{s/3/3 /:#{s/4/4 /:#{s/5/5 /:#{s/6/6 /:#{s/7/7 /:#{s/8/8 /:#{s/9/9 /:#{window_index}}}}}}}}}}}"
set -g @num_none_panes "#{s/0/0 /:#{s/1/1 /:#{s/2/2 /:#{s/3/3 /:#{s/4/4 /:#{s/5/5 /:#{s/6/6 /:#{s/7/7 /:#{s/8/8 /:#{s/9/9 /:#{window_panes}}}}}}}}}}}"
set -g @num_sub_idx "#{s/0/₀ /:#{s/1/₁ /:#{s/2/₂ /:#{s/3/₃ /:#{s/4/₄ /:#{s/5/₅ /:#{s/6/₆ /:#{s/7/₇ /:#{s/8/₈ /:#{s/9/₉ /:#{window_index}}}}}}}}}}}"
set -g @num_sub_panes "#{s/0/₀ /:#{s/1/₁ /:#{s/2/₂ /:#{s/3/₃ /:#{s/4/₄ /:#{s/5/₅ /:#{s/6/₆ /:#{s/7/₇ /:#{s/8/₈ /:#{s/9/₉ /:#{window_panes}}}}}}}}}}}"
set -g @num_super_idx "#{s/0/⁰ /:#{s/1/¹ /:#{s/2/² /:#{s/3/³ /:#{s/4/⁴ /:#{s/5/⁵ /:#{s/6/⁶ /:#{s/7/⁷ /:#{s/8/⁸ /:#{s/9/⁹ /:#{window_index}}}}}}}}}}}"
set -g @num_super_panes "#{s/0/⁰ /:#{s/1/¹ /:#{s/2/² /:#{s/3/³ /:#{s/4/⁴ /:#{s/5/⁵ /:#{s/6/⁶ /:#{s/7/⁷ /:#{s/8/⁸ /:#{s/9/⁹ /:#{window_panes}}}}}}}}}}}"

# Default status bar for all windows
default_window_terminal="#[fg=#{@thm_surface_1}]󰆍 "
default_window_number="#[fg=#{@thm_surface_1}]#{E:@num_dsquare_idx}"
default_window_name="#[fg=#{@thm_surface_1}]#{?#{==:#{window_name},window},#{pane_current_command},#W}"
default_window_panes="#[fg=#{@thm_surface_1}]#{E:@num_hsquare_panes}"
default_window_flags="\
#{?#{window_last_flag},󰖲 ,󰖰 }\
#{?#{window_zoomed_flag},󰁌 ,}\
#[fg=#{@thm_yellow}]#{?#{window_marked_flag},󰙒 ,}\
"

# Custom status bar for current window
current_window_terminal="#[fg=#{@thm_maroon}]󰆍 "
current_window_number="#[fg=#{@thm_peach}]#{E:@num_msquare_idx}"
current_window_name="#[fg=#{@thm_fg}]#{?#{==:#{window_name},window},#{pane_current_command},#W}"
current_window_panes="#[fg=#{@thm_overlay_2}]#{E:@num_hsquare_panes}"
current_window_flags="#[fg=#{@thm_yellow}]\
#{?#{window_active},󰖯 ,}\
#{?#{window_zoomed_flag},󰁌 ,}\
#{?#{window_marked_flag},󰙒 ,}\
"

# Change prefix key
unbind C-b
set-option -g prefix M-u
bind M-u send-prefix

# Sessions
bind o choose-tree -Z -s
bind -n M-9 switch-client -p
bind -n M-0 switch-client -n

# Windows
bind -n M-\, previous-window
bind -n M-\. next-window

bind -n M-\< swap-window -t -1\; select-window -t -1
bind -n M-\> swap-window -t +1\; select-window -t +1

bind -n M-1 select-layout even-horizontal
bind -n M-2 select-layout even-vertical
bind -n M-3 select-layout main-horizontal
bind -n M-4 select-layout main-horizontal-mirrored
bind -n M-5 select-layout main-vertical
bind -n M-6 select-layout main-vertical-mirrored
bind -n M-7 select-layout tiled

# Panes
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind V choose-tree -Z 'join-pane -h -s "%%"'
bind S choose-tree -Z 'join-pane -v -s "%%"'

bind b if -F "#{>:#{window_panes},1}" { break-pane -a }

# copy mode vim keybindings
bind "[" copy-mode \; send -X start-of-line

bind -T copy-mode-vi v send -X rectangle-off \; send -X begin-selection
bind -T copy-mode-vi C-q send -X rectangle-on \; send -X begin-selection

bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi p send -X cancel \; paste-buffer

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Configure Tmux
set -g status-position bottom
set -g status-style "bg=#{@thm_mantle}"
set -g status-justify "left"

# Theme
set -s theme terminal

# Style
set -g @custom_status_separator "#[fg=#{@thm_surface_2},bg=default,none]"
set -g @custom_status_inline "󱋱"
set -g @custom_text "#[fg=#{@thm_subtext_0}]"

# status left look and feel
set -g status-left-length 80
set -g status-left ""

# status left modules
set -ga status-left "#[fg=#{@thm_green}]#{?client_prefix,#[fg=#{@thm_red}],} 󱗜 #S 󰅂  #[none]"

# status right look and feel
set -g status-right-length 160
set -g status-right ""

# status right modules
set -ga status-right "#{E:#{@custom_status_separator}}"
set -ga status-right "#[fg=#{@thm_blue}]#{E:#{@custom_status_inline}} 󰉋 #{E:#{@custom_text}}#{b:pane_current_path} "

set -ga status-right "#{E:#{@custom_status_separator}}"
set -ga status-right "#[fg=#{@thm_mauve}]#{E:#{@custom_status_inline}} 󰍹 #{E:#{@custom_text}}#h "
set -ga status-right "#[fg=#{@thm_lavender}]#{E:#{@custom_status_inline}} 󱨰 #{E:#{@custom_text}}%Y-%m-%d "
set -ga status-right "#[fg=#{@thm_lavender}]#{E:#{@custom_status_inline}} 󰅐 #{E:#{@custom_text}}%H:%M:%S "

# pane border look and feel
set -g pane-border-status off
set -g pane-border-format ""
set -g pane-active-border-style "fg=#{@thm_peach},bg=default"
set -g pane-border-style "fg=#{@thm_overlay_2},bg=default"
set -g pane-border-lines single

# popup
setw -g popup-border-style "fg=#{@thm_peach},bg=default"

# choose tree
set -g mode-style "fg=#{@thm_fg},bg=#{@thm_surface_1},bold"
set -g tree-mode-border-style "fg=#{@thm_fg},bg=#{@thm_bg}"

# command line look and feel
set -g message-style "bg=#{@thm_surface_0}, fg=#{@thm_fg}, fill=#{@thm_surface_0}"
set -g message-command-style "bg=#{@thm_mantle}, fg=#{@thm_fg}, fill=#{@thm_mantle}"

# window status format
set -gF window-status-separator "#[fg=#{@thm_surface_1}] "
set -g window-status-format " $default_window_terminal$default_window_number$default_window_name $default_window_panes$default_window_flags "
set -g window-status-style "bg=default"

# window status current format
set -g window-status-current-format " $current_window_terminal$current_window_number$current_window_name $current_window_panes$current_window_flags "
set -g window-status-current-style "bg=#{@thm_bg}"

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Bootstrap
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
